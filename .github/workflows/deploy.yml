name: deploy to mixhost

on:
    push:
        branches:
            - main

jobs:
    deploy-frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./frontend
        steps:
            - uses: actions/checkout@v2

            - name: ssh key generate
              run: |
                  echo "$SSH_PRIVATE_KEY" > key
                  chmod 600 key
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.MIXHOST_SECRET_KEY }} # GitHubに登録したmixhostへの秘密鍵を指定

            - name: create env file
              run: |
                  echo "VITE_SOCKETIO_URL=$VITE_SOCKETIO_URL" > .env
              env:
                  VITE_SOCKETIO_URL: ${{ secrets.VITE_SOCKETIO_URL }}

            - name: vite build
              run: |
                  npm install
                  npm run build
                  ls -la dist # ビルドが成功しているか確認

            - name: copy htaccess file
              run: |
                  cp .htaccess.example dist/.htaccess

            - name: rsync deployments
              uses: burnett01/rsync-deployments@5.1
              with:
                  switches: -avz --delete
                  path: frontend/dist/ # 絶対パスに変更
                  remote_path: /home/bvzvxvoh/public_html/subdomains/sub11/ # mixhostのどこに同期させるか
                  remote_host: fast5-blog.com
                  remote_user: bvzvxvoh
                  remote_port: 22
                  remote_key: ${{ secrets.MIXHOST_SECRET_KEY }}

    deploy-backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./backend
        steps:
            - uses: actions/checkout@v2

            - name: ssh key generate
              run: |
                  echo "$SSH_PRIVATE_KEY" > key
                  chmod 600 key
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.MIXHOST_SECRET_KEY }}

            - name: create env file
              run: |
                  echo "FRONTEND_URL=$FRONTEND_URL" > .env
                  echo "PORT=$PORT" >> .env
              env:
                  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
                  PORT: ${{ secrets.PORT }}

            - name: vite build
              run: |
                  npm install
                  npm run build

            - name: copy htaccess file
              run: |
                  cp .htaccess.example dist/.htaccess

            - name: rsync deployments
              uses: burnett01/rsync-deployments@5.1
              with:
                  switches: -avz --delete
                  path: backend/dist/ # mixhostに送りたいファイルのあるパスを指定
                  remote_path: /home/bvzvxvoh/public_html/subdomains/sub12/ # mixhostのどこに同期させるか
                  remote_host: fast5-blog.com
                  remote_user: bvzvxvoh
                  remote_port: 22
                  remote_key: ${{ secrets.MIXHOST_SECRET_KEY }}
